name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verifikasi:
    name: Gerbang verifikasi AMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Typecheck, lint, unit test, penjaga gudang, build
        run: npm run verifikasi
