services:
  - type: web
    name: ams-integrated-staging
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ams-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_ENV
        value: staging
      - key: VITE_DEPLOYMENT_ENV
        value: staging
      - key: AMS_DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_SETUP_TOKEN
        generateValue: true
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIRESTORE_DATABASE_ID
        sync: false
